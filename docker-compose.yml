version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: logs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret123
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: python_log_analyzer
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: logs_db
      DB_USER: postgres
      DB_PASS: secret123

volumes:
  pgdata:
