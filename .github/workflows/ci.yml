name: Docker Compose CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for PostgreSQL readiness
        run: |
          until docker compose exec -T db pg_isready -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Print container logs for debugging
        run: docker compose logs

      - name: Verify data insertion in PostgreSQL (Retry loop)
        run: |
          MAX_RETRIES=15
          COUNT=0
          ROWS=0

          until [ "$ROWS" -ge 2 ] || [ "$COUNT" -eq "$MAX_RETRIES" ]; do
            echo "Attempt $((COUNT+1))/$MAX_RETRIES: Checking database records..."
            ROWS=$(docker compose exec -T db psql -U postgres -d logs_db -t -c "SELECT COUNT(*) FROM critical_errors;" 2>/dev/null | xargs || echo "0")

            # אם המשתנה ריק, הגדר אותו כ-0
            if [ -z "$ROWS" ]; then ROWS=0; fi

            if [ "$ROWS" -lt 2 ]; then
              sleep 3
            fi
            COUNT=$((COUNT+1))
          done

          echo "Found $ROWS critical error logs in database."

          if [ "$ROWS" -ge 2 ]; then
            echo "SUCCESS: Log analyzer successfully processed and saved errors to PostgreSQL!"
          else
            echo "ERROR: Expected at least 2 log entries in DB, but found $ROWS"
            exit 1
          fi

      - name: Bring down containers
        run: docker compose down -v
